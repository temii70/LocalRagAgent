name: Verify published evidence and mock MCP

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fresh-checkout benchmark bytes and metrics
        run: python -m unittest discover -s evaluation -p test_portability.py -v
      - name: Install ranking and MCP test dependencies
        run: python -m pip install numpy==2.4.2 rank-bm25==0.2.2 -r mock_mcp/requirements.txt
      - name: Test retrieval helpers
        run: python -m unittest discover -s evaluation -p test_public.py -v
      - name: Test approval enforcement and MCP stdio
        run: python -m unittest mock_mcp.test_core mock_mcp.test_stdio -v
